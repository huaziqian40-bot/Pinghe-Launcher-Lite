name: Build macOS DMG

# 打 tag(v*) 时自动为 macOS 构建 .app + .dmg, 并挂到同名 GitHub Release;
# 也可以在 Actions 页面手动触发(先产出 artifact, 不碰 Release)。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # 需要写 Release 资产

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Intel 机器已较少, 构建失败不影响 Apple Silicon 产物
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14        # Apple Silicon(M 系列)原生
            optional: false
          - arch: x86_64
            runner: macos-13        # Intel(旧 Mac 也能用)
            optional: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pyinstaller>=6.0" \
            "pywebview>=5.0" \
            "requests>=2.32" "beautifulsoup4>=4.12" "edupage-api" \
            "keyring>=25.0" "python-docx>=1.0" \
            "pystray>=0.19" "Pillow>=10.0" "PyYAML>=6.0" \
            pyobjc-core pyobjc-framework-Cocoa

      - name: 生成 macOS 图标(ui/logo.png → logo.icns)
        run: |
          # 仓库里的源图是 ui/logo.png(根目录只有 Windows 用的 logo.ico)
          SRC="ui/logo.png"
          [ -f "$SRC" ] || SRC="logo.png"
          test -f "$SRC" || { echo "找不到图标源文件"; exit 1; }
          rm -rf logo.iconset && mkdir -p logo.iconset
          for s in 16 32 64 128 256 512; do
            sips -z $s $s "$SRC" --out "logo.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "$SRC" --out "logo.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns logo.iconset -o logo.icns
          ls -lh logo.icns

      - name: PyInstaller 打包 .app
        run: python -m PyInstaller --noconfirm --clean PingheLauncherLite-mac.spec

      - name: 临时签名(减少 Gatekeeper 摩擦)
        run: codesign --force --deep --sign - "dist/Pinghe Launcher Lite.app" || true

      - name: 打包 DMG
        id: dmg
        run: |
          APP="dist/Pinghe Launcher Lite.app"
          test -d "$APP" || { echo "找不到 .app, 构建失败"; exit 1; }
          STAMP=$(date +%Y%m%d)
          OUT="PingheLauncherLite-mac-${STAMP}-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Pinghe Launcher Lite" -srcfolder "$APP" \
            -ov -format UDZO "$OUT"
          ls -lh "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: ${{ steps.dmg.outputs.file }}
          if-no-files-found: error

      - name: 挂到 GitHub Release(仅 tag 触发时)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE="${{ steps.dmg.outputs.file }}"
          # Release 正文由主流程撰写; 这里只补资产, 绝不改动说明文字
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Pinghe Launcher Lite $TAG" \
              --notes "macOS 版(其余说明见仓库 README)" \
              --verify-tag
          fi
